# Engram — Cloudflare Worker deploy
#
# Operator must add these GitHub repo secrets before first run:
# CLOUDFLARE_API_TOKEN (workers:edit + d1:edit scope), CLOUDFLARE_ACCOUNT_ID,
# ANTHROPIC_API_KEY, BETTER_AUTH_SECRET. Use `wrangler secret put` once
# locally to seed the Worker, then this workflow keeps deploys in sync.
# App-Store/Play-Store mobile-build workflows are separate (P1, next dispatch).

name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15

    permissions:
      contents: read

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::server/package-lock.json missing — falling back to npm install. Commit a lockfile to enable reproducible builds."
            npm install --no-audit --no-fund
          fi

      - name: Detect D1 migrations
        id: migrations
        run: |
          if [ -d migrations ] && [ -n "$(ls -A migrations 2>/dev/null)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply D1 migrations
        if: steps.migrations.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          command: d1 migrations apply engram --remote --persist-to ./.wrangler/state

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          command: deploy
          secrets: |
            ANTHROPIC_API_KEY
            BETTER_AUTH_SECRET
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
