# Engram — production Cloudflare Worker deployment.
# This workflow operates on the actual default branch (master).
# Required secrets and environment variables are documented in
# docs/operations/CLOUD_DEPLOYMENT.md. Nothing is deployed without them.
name: Deploy Worker

on:
  push:
    branches: [master]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Validate, migrate, deploy and smoke-test API
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20

    defaults:
      run:
        working-directory: server

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
      APP_ORIGINS: ${{ vars.APP_ORIGINS }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify production credentials and origins
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ANTHROPIC_API_KEY BETTER_AUTH_SECRET BETTER_AUTH_URL APP_ORIGINS; do
            if [[ -z "$(printenv "$name")" ]]; then
              echo "::error::Missing production secret or variable: $name. See docs/operations/CLOUD_DEPLOYMENT.md."
              exit 1
            fi
          done

          if [[ "$BETTER_AUTH_URL" != https://* || "$BETTER_AUTH_URL" == *"<"* ]]; then
            echo "::error::BETTER_AUTH_URL must be an actual HTTPS API origin."
            exit 1
          fi
          if [[ ",$APP_ORIGINS," != *",https://mavioni.github.io,"* ]]; then
            echo "::error::APP_ORIGINS must include https://mavioni.github.io (no /Engram path)."
            exit 1
          fi

      - name: Install Worker dependencies
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Typecheck Worker
        run: npm run typecheck

      - name: Require database migrations
        shell: bash
        run: |
          if [[ ! -d src/db/migrations ]] || ! compgen -G 'src/db/migrations/*.sql' > /dev/null; then
            echo "::error::No migrations found in server/src/db/migrations."
            exit 1
          fi

      - name: Apply remote D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          command: d1 migrations apply engram --remote

      - name: Deploy Worker with production configuration
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          command: deploy
          vars: |
            BETTER_AUTH_URL
            APP_ORIGINS
          secrets: |
            ANTHROPIC_API_KEY
            BETTER_AUTH_SECRET

      - name: Smoke-test deployed origin, authentication and CORS
        shell: bash
        run: |
          set -euo pipefail
          base="$(printf '%s' "$BETTER_AUTH_URL" | sed 's:/*$::')"

          curl --fail --silent --show-error --max-time 20 "$base/" |
            node -e 'let data="";process.stdin.on("data",d=>data+=d);process.stdin.on("end",()=>{const response=JSON.parse(data);if(response.ok!==true||response.service!=="engram-api")process.exit(1)})'

          headers="$(mktemp)"
          status="$(curl --silent --show-error --max-time 20 --output /dev/null --dump-header "$headers" --write-out '%{http_code}' -H 'Origin: https://mavioni.github.io' "$base/api/me")"
          if [[ "$status" != 401 ]]; then
            echo "::error::Unauthenticated /api/me must return 401; got $status."
            exit 1
          fi
          if ! tr -d '\r' < "$headers" | grep -Fxiq 'access-control-allow-origin: https://mavioni.github.io'; then
            echo "::error::The Engram Pages origin is missing from API CORS headers."
            exit 1
          fi

          auth_status="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "$base/api/auth/get-session")"
          if [[ "$auth_status" != 200 ]]; then
            echo "::error::Better Auth session route returned $auth_status instead of 200."
            exit 1
          fi

          echo "API reachable; unauthenticated endpoint denied; session route and Pages CORS respond."
