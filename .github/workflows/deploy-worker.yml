# Engram — Cloudflare Worker deploy
#
# This workflow is deliberately manual. It never applies D1 migrations.
# Remote migrations require a separate review and explicit operator action.
# Configure the GitHub "production" environment with required reviewers.
#
# Required repository secrets for a manual Worker deploy:
# CLOUDFLARE_API_TOKEN (Workers edit only; D1 edit is not needed here)
# CLOUDFLARE_ACCOUNT_ID, ANTHROPIC_API_KEY, BETTER_AUTH_SECRET.
# No Sakana or OpenAI secret is required until a provider adapter is implemented.

name: Deploy Worker

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Confirm that this dispatch is an authorized production deployment."
        required: true
        type: boolean
        default: false

concurrency:
  group: deploy-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm_production_deploy == true
    name: Deploy to Cloudflare
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15

    permissions:
      contents: read

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::error::server/package-lock.json is required for reproducible production deployment."
            exit 1
          fi

      - name: Typecheck Worker
        run: npm run typecheck

      - name: Deploy Worker (no database migrations)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          command: deploy
          secrets: |
            ANTHROPIC_API_KEY
            BETTER_AUTH_SECRET
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
