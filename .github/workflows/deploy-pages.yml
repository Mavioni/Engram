name: Publish Engram Notebook to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: engram-pages
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    name: Build, browser QA, publish
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - name: Preserve QA screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engram-pages-visual-qa
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy verified Notebook site
        id: deployment
        uses: actions/deploy-pages@v4
