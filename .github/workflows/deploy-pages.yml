name: Publish Engram Preview to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'preview/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: preview
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
