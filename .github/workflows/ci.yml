name: Engram CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: engram-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client:
    name: Client build and browser contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - name: Preserve browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engram-browser-qa
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  worker:
    name: Cloudflare Worker typecheck
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Verify every D1 migration against a fresh local database
        run: npx wrangler d1 migrations apply engram --local --persist-to ./.wrangler/state
      - name: Verify Notebook table exists after migrations
        run: npx wrangler d1 execute engram --local --persist-to ./.wrangler/state --command "SELECT COUNT(*) FROM notebook_entries"
